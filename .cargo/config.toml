mxm-measure = { path = "Z:/newDAWn/kit/mxm-kit-eq-n/crates/mxm-measure" }
mxm-modulation = { path = "Z:/newDAWn/kit/mxm-kit-eq-n/crates/mxm-modulation" }
mxm-modulation-params = { path = "Z:/newDAWn/kit/mxm-kit-eq-n/crates/mxm-modulation-params" }
