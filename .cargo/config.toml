[alias]
xtask = "run --package xtask --release --"

# >>> local kit: mxm-kit's feat/eq-n (its port/audit-o9 plus mxm-fft and the surface API), until
# it reaches main. Closer than the workspace's link, so it wins for this repository. Remove before
# any push.
[patch."https://github.com/mxm-audio/mxm-kit"]
mxm-audio-file = { path = "Z:/newDAWn/kit/mxm-kit-eq-n/crates/mxm-audio-file" }
